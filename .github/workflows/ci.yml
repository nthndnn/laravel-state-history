name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on PHP ${{ matrix.php-version }} with Laravel ${{ matrix.laravel }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php-version: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php-version: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php-version: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php-version: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php-version: '8.4'
            laravel: '13.*'
            testbench: '11.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer update --no-install --prefer-dist --no-interaction
          composer update "laravel/framework:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --with-all-dependencies --prefer-dist --no-interaction

      - name: Check code formatting
        run: composer format-test

      - name: Run tests
        run: composer test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}
          path: |
            .phpunit.result.cache
            .phpunit.result.xml
